not a command line. Interject, correct yourself, chain three requests in one breath — the intent net untangles all of it. A low-latency response path keeps the loop under a blink, and an offline whisper mode keeps listening when the network drops.",subs:["Continuous conversation — no wake-word gymnastics","Multi-intent parsing in a single utterance","Context-aware follow-ups and corrections","Adaptive synthetic voice with persona tuning","40+ languages with live translation","Offline whisper mode for air-gapped rooms"],tags:["NEURAL-ASR","TTS-4","INTENT-NET"],span:"lg:col-span-7"},{id:"vision",code:"MOD-02 // VISION",index:"02",name:"Vision",tag:"A synthetic retina for screen and camera.",desc:"NOVA reads what you see — screens, documents, rooms — and answers questions about it in real time.",detail:"The vision module fuses screen capture and camera input into one scene graph. Point at anything and ask 'what is this', 'summarize this', 'find the difference' — NOVA segments the scene, runs OCR and recognition passes, and responds with pixel-level references you can click through.",subs:["Real-time screen understanding","Object, face-blurred and text recognition","Visual Q&A — 'what's on my screen?'","Document and handwriting parsing","Gaze-aware focus assistance","Pixel-level answer references"],tags:["OCR-X","SCENE-NET","GAZE-01"],span:"lg:col-span-5"},{id:"control",code:"MOD-03 // OS.BRIDGE",index:"03",name:"Computer Control",tag:"Your machine, operated at machine speed.",desc:"Mouse, keyboard, applications, files. NOVA drives your operating system the way you would — only faster and without the coffee breaks.",detail:"OS.BRIDGE speaks the native language of your desktop. It launches apps, fills forms, drags files, navigates browsers and verifies its own actions against your intent before committing. Every operation is logged to a rewindable action tape, so nothing happens in the dark.",subs:["Application launch and live control","Form filling and browser navigation","Cross-app workflow execution","File operations with conflict detection","Self-verification before commit","Rewindable action tape for every move"],tags:["OS-BRIDGE","ACTION-CORE","REWIND"],span:"lg:col-span-5"},{id:"automation",code:"MOD-04 // FLOW",index:"04",name:"Automation",tag:"Record once. Repeat flawlessly.",desc:"Turn any routine into a flow: record it, schedule it, or trigger it on events — with conditional logic built in.",detail:"Describe a routine in one sentence or demonstrate it once — FLOW compiles either into a deterministic execution graph. Branch on conditions, retry on failure, escalate when stuck. Flows compose with every other module, so a flow can speak, see and operate your machine mid-run.",subs:["One-phrase routine builder","Record-by-demonstration capture","Schedule and event-based triggers","Conditional logic chains with branches","Automatic retry and error handling","Flows can call Voice, Vision and Control mid-run"],tags:["FLOW-ENGINE","TRIGGERS","GRAPH-VM"],span:"lg:col-span-7"},{id:"memory",code:"MOD-05 // MEM.CORE",index:"05",name:"Memory",tag:"It remembers, so you don't have to.",desc:"A persistent knowledge graph of your world — every conversation, file and decision, recallable in plain language.",detail:"MEM.CORE weaves everything NOVA touches into a local-first knowledge graph. Ask 'what did I say about the render bug last Tuesday?' and it surfaces the exact thread. Memory is scoped per project, encrypted at rest, and you hold the only key — forgetfulness is a command, not a limitation.",subs:["Persistent knowledge graph, local-first","Natural-language recall across time","Per-project memory scopes","Encrypted vault — you hold the key","Selective amnesia on command","Decision history with sources"],tags:["MEM-CORE","KG-BUILD","VAULT"],span:"lg:col-span-4"},{id:"plugins",code:"MOD-06 // PLUGINS",index:"06",name:"Plugins",tag:"Extend the mind. Wire in anything.",desc:"An open module SDK that lets you bolt new senses and skills o
